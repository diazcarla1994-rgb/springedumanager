<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Gestión de Cursos</h2>
    
    <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post" class="mb-4">
        <div class="mb-3">
            <label class="form-label">Nombre del Curso:</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <input type="text" th:field="*{descripcion}" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Guardar Curso</button>
    </form>

    <h3>Lista de Cursos</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${cursos}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.descripcion}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
